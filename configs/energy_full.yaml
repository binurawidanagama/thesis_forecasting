random_seed: 42

paths:
  engineered_csv: "data/processed/AT_engineered.csv"
  interim_dir: "data/interim_energy_full"
  checkpoints_dir: "checkpoints_energy_full"
  outputs_dir: "outputs_energy_full"
  windows_npz: "data/interim_energy_full/windows.npz"

time:
  tz_output: "UTC"
  split:
    train_until: "2020-12-31 23:00:00"
    val_until:   "2021-12-31 23:00:00"
    test_until:  "2022-12-31 23:00:00"

columns:
  timestamp: "Time (UTC)"
  wind_mw: "Wind_MW"
  solar_mw: "Solar_MW"
  load_mw: "Actual_Load_MW"
  price_eur_mwh: "Price_EUR_MWh"
  cf_wind: "CF_Wind"
  cf_solar: "CF_Solar"
  cap_wind_mw: "Wind_Cap_MW"
  cap_solar_mw: "Solar_Cap_MW"
  holiday_flags: ["is_public_holiday","is_weekend","is_special_day"]

features:
  context_hours: 168
  horizon_hours: 12

  # Fix #1: include weekly cycle + flags
  # Fix #2: remove capacities from encoder inputs; define them separately as static_features
  input_features: [
    "hour_sin", "hour_cos",
    "dow_sin", "dow_cos",
    "month_sin", "month_cos",

    "is_weekend", "is_public_holiday", "is_special_day",

    "temperature_2m_C", "relative_humidity_2m_pct",
    "wind_speed_100m (m/s)", "surface_pressure_hPa",
    "shortwave_radiation_Wm2", "precipitation_mm",

    "wind_mw", "solar_mw", "load_mw",
    "cf_wind", "cf_solar"
  ]

  # Fix #2: static descriptors bypass encoder and are concatenated before ELM
  static_features: ["cap_wind_mw", "cap_solar_mw"]

  target_features: ["wind_mw", "solar_mw", "load_mw"]

scaling:
  type: standard

training:
  encoder:
    latent_channels: 128
    lr: 0.0001
    batch_size: 128
    epochs: 20
  elm:
    hidden: 1024
    ridge_lambda: 1e-3
    ensemble: 1

asp:
  solar_night_hours: [0,1,2,3,4,21,22,23]
  program: "src/asp/energy_physics.lp"
  target_map:
    wind_mw: "wind"
    solar_mw: "solar"
    load_mw: "load"
